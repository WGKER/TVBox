name: OK Build TVBox armeabi Release Signed APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 生成local.properties
        run: touch local.properties && echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: 全局强制官方Maven源，屏蔽阿里云
        run: |
          mkdir -p ~/.gradle
          echo "allprojects {" > ~/.gradle/init.gradle
          echo "buildscript {" >> ~/.gradle/init.gradle
          echo "repositories {" >> ~/.gradle/init.gradle
          echo "google()" >> ~/.gradle/init.gradle
          echo "mavenCentral()" >> ~/.gradle/init.gradle
          echo "}" >> ~/.gradle/init.gradle
          echo "}" >> ~/.gradle/init.gradle
          echo "repositories {" >> ~/.gradle/init.gradle
          echo "google()" >> ~/.gradle/init.gradle
          echo "mavenCentral()" >> ~/.gradle/init.gradle
          echo "}" >> ~/.gradle/init.gradle
          echo "}" >> ~/.gradle/init.gradle

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      - name: 编译armeabi Release
        run: "./gradlew :app:assembleArmeabiGenericNormalRelease --no-daemon"

      - name: 安装Android构建工具 + zipalign
        run: sudo apt update && sudo apt install android-sdk-build-tools zipalign -y

      - name: 标准重签名流程（对齐+清旧签名+v2+v3签名）
        run: |
          export PATH=$PATH:/usr/lib/android-sdk/build-tools/*/
          # 固定你的真实APK路径
          RAW_APK=app/build/outputs/apk/armeabiGenericNormal/release/TVBox_release-armeabi-generic-java.apk
          TMP_ALIGNED=aligned.apk
          FINAL_APK=TVBox_armeabi_installable.apk

          # 1. zipalign字节对齐（安卓强制要求）
          zipalign -f 4 "$RAW_APK" "$TMP_ALIGNED"

          # 2. 生成测试密钥
          keytool -genkey -noprompt \
            -alias testkey \
            -dname "CN=test,OU=test,O=test,L=test,S=test,C=CN" \
            -keystore temp.jks \
            -storepass 123456 \
            -keypass 123456 \
            -keyalg RSA \
            -validity 10000

          # 3. v2+v3同时签名，兼容新旧电视/安卓系统
          apksigner sign \
            --ks temp.jks \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK" \
            "$TMP_ALIGNED"

          rm -f "$TMP_ALIGNED"

      - name: 上传最终可安装签名APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_armeabi_完整签名可直接安装
          path: TVBox_armeabi_installable.apk
          retention-days: 30
