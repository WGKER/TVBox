name: Build TVBox armeabi Release Signed APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 生成local.properties
        run: touch local.properties && echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: 全局强制官方Maven源，屏蔽阿里云
        run: |
          mkdir -p ~/.gradle
          echo "allprojects {" > ~/.gradle/init.gradle
          echo "buildscript {" >> ~/.gradle/init.gradle
          echo "repositories {" >> ~/.gradle/init.gradle
          echo "google()" >> ~/.gradle/init.gradle
          echo "mavenCentral()" >> ~/.gradle/init.gradle
          echo "}" >> ~/.gradle/init.gradle
          echo "}" >> ~/.gradle/init.gradle
          echo "repositories {" >> ~/.gradle/init.gradle
          echo "google()" >> ~/.gradle/init.gradle
          echo "mavenCentral()" >> ~/.gradle/init.gradle
          echo "}" >> ~/.gradle/init.gradle
          echo "}" >> ~/.gradle/init.gradle

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      - name: 编译armeabi Release
        run: "./gradlew :app:assembleArmeabiGenericNormalRelease --no-daemon"

      # 打印目录，确认真实apk路径
      - name: 查看编译输出目录
        run: find app/build/outputs/apk -type f -name "*.apk"

      - name: 安装签名工具
        run: |
          sudo apt update
          sudo apt install android-sdk-build-tools -y
          export PATH=$PATH:/usr/lib/android-sdk/build-tools/*/

      - name: 自动生成密钥并批量签名所有未签名APK
        run: |
          export PATH=$PATH:/usr/lib/android-sdk/build-tools/*/
          keytool -genkey -noprompt \
            -alias testkey \
            -dname "CN=test,OU=test,O=test,L=test,S=test,C=CN" \
            -keystore temp.jks \
            -storepass 123456 \
            -keypass 123456 \
            -keyalg RSA \
            -validity 10000
          # 自动匹配unsigned apk
          APK=$(find app/build/outputs/apk -name "*unsigned.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "未找到未签名APK"
            exit 1
          fi
          apksigner sign --ks temp.jks --ks-pass pass:123456 --key-pass pass:123456 "$APK"
          mv "$APK" TVBox_armeabi_signed.apk

      - name: 上传成品签名APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_armeabi_signed_APK
          path: TVBox_armeabi_signed.apk
          retention-days: 30
