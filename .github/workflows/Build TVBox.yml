name: Build TVBox Temp Signed APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置JDK11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: 生成local.properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      # 全局强制使用官方源，彻底抛弃故障阿里云镜像
      - name: 全局Gradle仓库重定向
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      # 只编译app模块，跳过pyramid Python相关任务
      - name: 编译Release APK
        run: ./gradlew :app:assembleRelease -x :pyramid:generateArm64ReleasePythonRequirements

      - name: 安装Android签名工具
        run: |
          sudo apt update
          sudo apt install android-sdk-build-tools -y
          export PATH=$PATH:/usr/lib/android-sdk/build-tools/*/

      # CI内自动生成测试签名，无需自备jks密钥
      - name: 临时密钥自动签名APK
        run: |
          keytool -genkey -noprompt \
            -alias testkey \
            -dname "CN=test, OU=test, O=test, L=test, S=test, C=CN" \
            -keystore temp.jks \
            -storepass 123456 \
            -keypass 123456 \
            -keyalg RSA \
            -validity 10000
          apksigner sign --ks temp.jks --ks-pass pass:123456 --key-pass pass:123456 app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 重命名已签名安装包
        run: mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/TVBox_signed.apk

      - name: 上传成品APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Signed_APK_NoPython
          path: app/build/outputs/apk/release/TVBox_signed.apk
          retention-days: 30
