name: Test Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # ========== 新增：安装Python并配置Chaquopy ==========
      - name: Install Python3 & set Chaquopy buildPython
        run: |
          sudo apt update && sudo apt install -y python3 python3-pip
          echo "buildPython=$(which python3)" >> gradle.properties

      # ========== 修复阿里云Maven 502 ==========
      - name: Replace Aliyun Maven to Tsinghua mirror
        run: |
          sed -i 's|https://maven.aliyun.com/repository/central|https://mirrors.tuna.tsinghua.edu.cn/maven|g' build.gradle

      - name: Build With Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --daemon --warning-mode all

      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          find ${{ github.workspace }} -path "*/build/outputs/apk/*" -name "*.apk" -exec mv {} ${{ github.workspace }}/apk/ \;

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.osc
          path: ${{ github.workspace }}/apk/*
