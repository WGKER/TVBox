name: Build TVBox Temp Signed APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置JDK11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: 生成local.properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: 替换Maven源，规避阿里云502
        run: |
          cat > init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://dl.google.com/dl/android/maven2/' }
                  maven { url 'https://repo1.maven.org/maven2/' }
                  google()
                  mavenCentral()
              }
          }
          EOF
          echo "-I init.gradle" >> gradlew

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      # 关键改动：排除pyramid模块，只编译app，不再执行Python相关任务
      - name: 编译Release APK（跳过pyramid）
        run: ./gradlew :app:assembleRelease -x :pyramid:generateArm64ReleasePythonRequirements

      - name: 安装签名工具
        run: |
          sudo apt update
          sudo apt install android-sdk-build-tools -y
          export PATH=$PATH:/usr/lib/android-sdk/build-tools/*/

      # CI自动生成测试签名
      - name: 临时生成密钥签名APK
        run: |
          keytool -genkey -noprompt \
            -alias testkey \
            -dname "CN=test, OU=test, O=test, L=test, S=test, C=CN" \
            -keystore temp.jks \
            -storepass 123456 \
            -keypass 123456 \
            -keyalg RSA \
            -validity 10000
          apksigner sign --ks temp.jks --ks-pass pass:123456 --key-pass pass:123456 app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 重命名成品包
        run: mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/TVBox_signed.apk

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Signed_APK_NoPython
          path: app/build/outputs/apk/release/TVBox_signed.apk
          retention-days: 30
